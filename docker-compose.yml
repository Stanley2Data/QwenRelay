services:
  qwenrelay:
    image: qwenrelay:local
    build: .
    shm_size: '40gb'
    command: ['--tp', '${TP:-1}']
    environment:
      CUDA_VISIBLE_DEVICES: '${CUDA_VISIBLE_DEVICES:-0}'
      MODELS_ROOT: /models
      API_KEY_FILE: /run/secrets/qwenrelay_api_key
      BIND_HOST: 0.0.0.0
      PORT: '18020'
    ports:
      - '127.0.0.1:${PORT:-18020}:18020'
    volumes:
      - type: bind
        source: '${MODEL_ASSET_DIR:?Set an absolute MODEL_ASSET_DIR in .env}'
        target: /models
        read_only: true
      - qwenrelay-cache:/cache
    secrets:
      - qwenrelay_api_key
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
secrets:
  qwenrelay_api_key:
    file: ./api_key.txt
volumes:
  qwenrelay-cache:
